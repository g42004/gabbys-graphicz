<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabby's Graphicz - Order Confirmed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f7f9;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-8 text-center space-y-6">
    <h1 class="text-3xl font-extrabold text-green-600">🎉 Thank You!</h1>
    <p class="text-gray-700 text-lg">Your payment has been processed successfully.</p>

    <!-- Order Summary -->
    <div id="order-summary" class="bg-gray-100 rounded-lg p-4 text-left text-gray-800">
      Loading order details...
    </div>

    <button
      onclick="window.location.href='order_step1.html'"
      class="mt-6 w-full py-3 px-4 rounded-lg shadow-md text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700"
    >
      Start a New Order
    </button>
  </div>

  <script>
    // Read URL params safely
    const params = new URLSearchParams(window.location.search);

    const amount = params.get('amount') || '0.00';
    const img = params.get('img') || '0';
    const font = params.get('font') || '0';
    const bg = params.get('bg') || '0';

    const coupon = params.get('coupon') === 'true';
    const couponCode = params.get('couponCode') || '';
    const discountRaw = parseFloat(params.get('discount'));
    const discount = isNaN(discountRaw) ? 0 : discountRaw;

    const methodRaw = params.get('method') || 'CARD';
    const method = methodRaw.toUpperCase();

    const discountValue = (discount * 100).toFixed(0);

    // Build summary HTML
    let summaryHTML = `
      <h2 class="text-xl font-bold mb-2">Order Summary</h2>
      <ul class="list-disc pl-5 space-y-1">
        <li>Images: ${img}</li>
        <li>Fonts: ${font}</li>
        <li>Backgrounds: ${bg}</li>
    `;

    if (coupon) {
      summaryHTML += `
        <li>Coupon Applied: ${couponCode} (${discountValue}% off)</li>
      `;
    }

    summaryHTML += `
        <li>Payment Method: ${method}</li>
        <li><strong>Total Paid: $${amount}</strong></li>
      </ul>
    `;

    // Insert into page
    document.getElementById('order-summary').innerHTML = summaryHTML;
  </script>

</body>
</html>
