<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 3: Confirmation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #ffe4f0; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
<div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-8 text-center space-y-6">
  <h1 class="text-3xl font-extrabold text-pink-600">🎉 Thank You!</h1>
  <p class="text-gray-700 text-lg">Your payment has been processed successfully.</p>
  <div id="order-summary" class="bg-gray-100 rounded-lg p-4 text-left text-gray-800"></div>
  <button onclick="window.location.href='step1.html'" class="w-full py-3 px-4 rounded-lg bg-pink-600 text-white font-bold">Start a New Order</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const summary = `
  <h2 class="text-xl font-bold mb-2">Order Summary</h2>
  <ul class="list-disc pl-5 space-y-1">
    <li>Images: ${params.get('img')}</li>
    <li>Fonts: ${params.get('font')}</li>
    <li>Backgrounds: ${params.get('bg')}</li>
    <li>Payment Method: ${params.get('method')?.toUpperCase()}</li>
    <li><strong>Total Paid: $${params.get('amount')}</strong></li>
  </ul>
`;
document.getElementById('order-summary').innerHTML = summary;
</script>
</body>
</html>
