<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 2: Payment</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-start justify-center p-4 sm:p-8 bg-pink-100">

<div class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-6 sm:p-8 space-y-6">
    <h1 class="text-3xl font-extrabold text-gray-900 border-b pb-4 mb-4">Step 2: Payment</h1>
    <p id="order-summary" class="text-gray-500 mb-6"></p>

    <label><input type="radio" name="paymentMethod" value="card" checked onchange="toggleCardForm('card')"> Credit/Debit Card</label>
    <label><input type="radio" name="paymentMethod" value="paypal" onchange="toggleCardForm('paypal')"> PayPal</label>
    <label><input type="radio" name="paymentMethod" value="wallet" onchange="toggleCardForm('wallet')"> Digital Wallet</label>

    <div id="card-details-form">
        <label>Card Number</label>
        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000">
        <label>Expiry Date</label>
        <input type="text" id="expiryDate" placeholder="MM/YY">
        <label>CVV</label>
        <input type="text" id="cvv" placeholder="123">
        <label>Cardholder Name</label>
        <input type="text" id="cardholderName" placeholder="John Doe">
    </div>

    <button onclick="processPayment()" class="w-full py-3 mt-4 bg-pink-400 rounded text-white font-bold">Confirm Payment</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const img = params.get('img');
const font = params.get('font');
const bg = params.get('bg');
const amount = params.get('amount');

document.getElementById('order-summary').innerHTML =
    `You selected ${img} images, ${font} fonts, and ${bg} backgrounds.<br><strong>Total: $${amount}</strong>`;

function toggleCardForm(method){
    document.getElementById('card-details-form').style.display = (method==='card')?'block':'none';
}

function processPayment(){
    const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
    params.set('method', selectedMethod);
    window.location.href = `confirmation_step3.html?${params.toString()}`;
}
</script>
</body>
</html>
