<!-- COMPLETE PAYMENT BUTTON -->
<button
id="completePaymentBtn"
onclick="completePayment()"
class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 rounded-2xl mt-6 transition">

Complete Payment →

</button>

<script>

// SELECTED PAYMENT
let selectedPayment = 'paypal';

// SELECT PAYMENT METHOD
function selectPayment(method, element){

  selectedPayment = method;

  // REMOVE ACTIVE CLASS
  document.querySelectorAll('.payment-card')
  .forEach(card => {

    card.classList.remove('active');

  });

  // ADD ACTIVE CLASS
  element.classList.add('active');

}

// COMPLETE PAYMENT
function completePayment(){

  // GET CURRENT URL PARAMETERS
  const currentParams =
  new URLSearchParams(window.location.search);

  // SAVE PAYMENT METHOD
  currentParams.set(
    'paymentMethod',
    selectedPayment
  );

  // OPTIONAL PAYPAL LOGIN
  if(selectedPayment === 'paypal'){

    window.open(
      'https://www.paypal.com/signin',
      '_blank'
    );

  }

  // OPTIONAL KLARNA
  if(selectedPayment === 'klarna'){

    window.open(
      'https://www.klarna.com/us/',
      '_blank'
    );

  }

  // OPTIONAL AFFIRM
  if(selectedPayment === 'affirm'){

    window.open(
      'https://www.affirm.com/',
      '_blank'
    );

  }

  // OPTIONAL AFTERPAY
  if(selectedPayment === 'afterpay'){

    window.open(
      'https://www.afterpay.com/',
      '_blank'
    );

  }

  // OPTIONAL CASH APP
  if(selectedPayment === 'cashappafterpay'){

    window.open(
      'https://cash.app/',
      '_blank'
    );

  }

  // GO TO STEP 3
  window.location.href =
  `confirmation_step3.html?${currentParams.toString()}`;

}

</script>
