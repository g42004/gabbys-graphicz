<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 2: Payment</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #ffe4f0; }
</style>
</head>
<body class="min-h-screen flex items-start justify-center p-4 sm:p-8">

<div id="payment-container" class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-6 sm:p-8 space-y-6">
  <h1 class="text-3xl font-extrabold text-pink-600 border-b pb-4 mb-4">Step 2: Payment</h1>
  <p class="text-gray-700 mb-4" id="order-summary">Loading order...</p>

  <label><input type="radio" name="paymentMethod" value="card" checked class="hidden" onchange="toggleCardForm('card')">
    <div class="p-4 border-2 border-gray-200 rounded-xl cursor-pointer">Credit/Debit Card</div>
  </label>
  <label><input type="radio" name="paymentMethod" value="paypal" class="hidden" onchange="toggleCardForm('paypal')">
    <div class="p-4 border-2 border-gray-200 rounded-xl cursor-pointer">PayPal</div>
  </label>

  <div id="card-details-form" class="space-y-4 pt-4 border-t mt-4">
    <input type="text" id="cardNumber" placeholder="Card Number">
    <input type="text" id="expiryDate" placeholder="MM/YY">
    <input type="text" id="cvv" placeholder="CVV">
    <input type="text" id="cardholderName" placeholder="Cardholder Name">
  </div>

  <button onclick="processPayment()" class="w-full py-3 px-4 rounded-lg bg-pink-600 text-white font-bold mt-4">Confirm Payment</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('order-summary').innerHTML = `
  You selected ${params.get('img')} images, ${params.get('font')} fonts, ${params.get('bg')} backgrounds.<br>
  <strong>Total: $${params.get('amount')}</strong>
`;

function toggleCardForm(method) {
  document.getElementById('card-details-form').style.display = (method === 'card') ? 'block' : 'none';
}

function processPayment() {
  const method = document.querySelector('input[name="paymentMethod"]:checked').value;
  params.set('method', method);
  window.location.href = `step3.html?${params.toString()}`;
}
</script>
</body>
</html>
