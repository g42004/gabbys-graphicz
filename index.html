<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Order Step 1</title>
<link href="https://fonts.googleapis.com/css2?family=Babaloo&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: 'Roboto', sans-serif;
    background: #ffe6f0; /* Pink background */
    min-height: 100vh;
    padding: 2rem;
  }
  .container { 
    background: rgba(255,255,255,0.95); 
    max-width: 1000px; 
    margin: auto; 
    padding: 2rem; 
    border-radius: 12px; 
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
  }
  h1 { font-family: 'Babaloo', cursive; font-size: 2.5rem; color:#F472B6; text-align:center; margin-bottom:1rem; }
  table { width:100%; border-collapse: collapse; margin-bottom:1rem; }
  th, td { padding:0.75rem; border-bottom:1px solid #ddd; text-align:left; }
  th { background-color:#F472B6; color:white; }
  .input-qty { width:60px; padding:0.25rem; border-radius:6px; border:1px solid #ccc; }
  .theme-input { width:100%; padding:0.5rem; border-radius:6px; border:1px solid #ccc; }
  .total { font-weight:bold; font-size:1.2rem; margin-top:1rem; text-align:right; }
  .button-base { background-color:#F472B6; color:white; padding:0.75rem 1.5rem; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:1rem; display:block; }
  footer { margin-top:2rem; text-align:center; font-size:0.9rem; color:#555; }
</style>
</head>
<body>

<div class="container">
  <h1>Gabby's Graphicz - Order Your Design</h1>

  <!-- Images & Illustrations -->
  <div>
    <h2 class="text-xl font-bold text-gray-700 mb-2">Images & Illustrations ($0.75 - $1.00 each)</h2>
    <input type="text" id="imgTheme" placeholder="Enter theme/type (e.g., poster, flyer, birthday)" class="theme-input mb-2">
    Quantity: <input type="number" id="imgQty" class="input-qty" value="0" min="0">
  </div>

  <!-- Fonts -->
  <div class="mt-4">
    <h2 class="text-xl font-bold text-gray-700 mb-2">Fonts & Typography Design ($1.50 - $3.50 per font)</h2>
    <select id="fontSelect" class="theme-input mb-2">
      <option value="Babaloo">Babaloo</option>
      <option value="Roboto">Roboto</option>
      <option value="Lobster">Lobster</option>
      <option value="Pacifico">Pacifico</option>
    </select>
    Quantity: <input type="number" id="fontQty" class="input-qty" value="0" min="0">
  </div>

  <!-- Backgrounds & Textures -->
  <div class="mt-4">
    <h2 class="text-xl font-bold text-gray-700 mb-2">Backgrounds & Textures ($1.50 - $3.50 per design)</h2>
    <input type="text" id="bgTheme" placeholder="Enter theme/type" class="theme-input mb-2">
    Quantity: <input type="number" id="bgQty" class="input-qty" value="0" min="0">
  </div>

  <!-- State/Country selection for tax -->
  <div class="mt-4">
    <h2 class="text-xl font-bold text-gray-700 mb-2">Select State or Country</h2>
    <select id="stateSelect" class="theme-input">
      <option value="NC" selected>North Carolina</option>
      <option value="NY">New York</option>
      <option value="CA">California</option>
      <option value="TX">Texas</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <!-- Coupon -->
  <div class="mt-4">
    <h2 class="text-xl font-bold text-gray-700 mb-2">Enter Coupon Code</h2>
    <input type="text" id="couponCode" placeholder="BlackFriday / Thanksgiving / Christmas" class="theme-input">
  </div>

  <!-- Totals -->
  <div class="total" id="totalDisplay">Total: $0.00</div>

  <!-- Proceed Button -->
  <button class="button-base" onclick="goToCart()">Add to Cart / Step 2</button>

</div>

<footer>© Gabrielle Monroe 2025</footer>

<script>
const taxRates = { 'NC': 0.0725, 'NY':0.08875, 'CA':0.0725, 'TX':0.0625, 'Other':0 };

// Base prices
const basePrices = { img:0.75, font:2.5, bg:2.5 };

// Coupons
const couponCodes = { 'BlackFriday':0.2, 'Thanksgiving':0.15, 'Christmas':0.1 };

function calculateTotal(){
  let imgQty = parseInt(document.getElementById('imgQty').value)||0;
  let fontQty = parseInt(document.getElementById('fontQty').value)||0;
  let bgQty = parseInt(document.getElementById('bgQty').value)||0;
  let subtotal = imgQty*basePrices.img + fontQty*basePrices.font + bgQty*basePrices.bg;

  // Coupon
  let code = document.getElementById('couponCode').value;
  let discount = couponCodes[code] || 0;
  let discounted = subtotal*(1-discount);

  // Tax
  const state = document.getElementById('stateSelect').value;
  const tax = discounted * (taxRates[state] || 0);

  const total = discounted + tax;
  document.getElementById('totalDisplay').innerHTML = `
    Subtotal: $${subtotal.toFixed(2)}<br>
    ${discount>0 ? 'Discount: -$'+(subtotal*discount).toFixed(2)+'<br>':''}
    Tax (${(taxRates[state]*100).toFixed(2)}%): $${tax.toFixed(2)}<br>
    <strong>Total: $${total.toFixed(2)}</strong>
  `;
}

document.getElementById('imgQty').addEventListener('input', calculateTotal);
document.getElementById('fontQty').addEventListener('input', calculateTotal);
document.getElementById('bgQty').addEventListener('input', calculateTotal);
document.getElementById('stateSelect').addEventListener('change', calculateTotal);
document.getElementById('couponCode').addEventListener('input', calculateTotal);

function goToCart(){
  let params = new URLSearchParams();
  params.set('imgQty', document.getElementById('imgQty').value);
  params.set('fontQty', document.getElementById('fontQty').value);
  params.set('bgQty', document.getElementById('bgQty').value);
  params.set('imgService', document.getElementById('imgTheme').value);
  params.set('fontSelect', document.getElementById('fontSelect').value);
  params.set('bgTheme', document.getElementById('bgTheme').value);
  params.set('state', document.getElementById('stateSelect').value);
  params.set('couponCode', document.getElementById('couponCode').value);
  window.location.href = `cart.html?${params.toString()}`;
}

// Initialize total
calculateTotal();
</script>

</body>
</html>
