<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 1: Order</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Roboto', sans-serif; background:#ffe6f0; }
  h1 { font-family:'Babaloo', cursive; color:#F472B6; text-align:center; margin-top:2rem; margin-bottom:1rem; }
  .container { max-width:900px; margin:auto; background:#fff; padding:2rem; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2);}
  .section { margin-bottom:1.5rem; }
  .coupon-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; }
  .coupon-content { background:#fff; padding:2rem; border-radius:12px; max-width:400px; width:90%; text-align:center; }
  .coupon-btn { background:#F472B6; color:#fff; padding:0.5rem 1rem; border-radius:8px; margin:0.5rem; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
  <h1>Step 1: Select Your Services</h1>

  <!-- Services Section -->
  <div class="section">
    <label>Images & Illustrations ($0.75 - $1.00 each)</label>
    <input type="number" id="imgQty" min="0" value="0" class="border px-2 py-1 rounded ml-2">
    <select id="imgType" class="border px-2 py-1 rounded ml-2">
      <option value="Poster">Poster</option>
      <option value="Flyer">Flyer</option>
      <option value="Logo">Logo</option>
      <option value="Birthday">Birthday</option>
    </select>
  </div>

  <div class="section">
    <label>Fonts & Typography ($1.50 - $3.50 each)</label>
    <input type="number" id="fontQty" min="0" value="0" class="border px-2 py-1 rounded ml-2">
    <select id="fontSelect" class="border px-2 py-1 rounded ml-2">
      <option value="Babaloo">Babaloo</option>
      <option value="Anton">Anton</option>
      <option value="Lobster">Lobster</option>
      <option value="Pacifico">Pacifico</option>
    </select>
  </div>

  <div class="section">
    <label>Backgrounds & Textures ($1.50 - $3.50 each)</label>
    <input type="number" id="bgQty" min="0" value="0" class="border px-2 py-1 rounded ml-2">
    <input type="text" id="bgTheme" placeholder="Theme (e.g., Cheetah)" class="border px-2 py-1 rounded ml-2">
  </div>

  <!-- Coupon Button -->
  <div class="section">
    <button onclick="openCouponModal()" class="coupon-btn">Apply Coupon</button>
    <span id="appliedCoupon" class="ml-2 font-bold"></span>
  </div>

  <!-- State Selection -->
  <div class="section">
    <label>Select State for Tax:</label>
    <select id="stateSelect" class="border px-2 py-1 rounded ml-2">
      <option value="NC" selected>North Carolina</option>
      <option value="CA">California</option>
      <option value="NY">New York</option>
      <option value="TX">Texas</option>
      <!-- Add all 46 other states here -->
    </select>
  </div>

  <!-- Proceed Button -->
  <div class="section">
    <button onclick="goToPayment()" class="coupon-btn">Next: Payment</button>
  </div>
</div>

<!-- Coupon Modal -->
<div id="couponModal" class="coupon-modal flex">
  <div class="coupon-content">
    <h2>Available Coupons</h2>
    <button class="coupon-btn" onclick="applyCoupon('BLACKFRIDAY',0.2)">Black Friday - 20% Off</button>
    <button class="coupon-btn" onclick="applyCoupon('THANKSGIVING',0.15)">Thanksgiving - 15% Off</button>
    <button class="coupon-btn" onclick="applyCoupon('CHRISTMAS',0.1)">Christmas - 10% Off</button>
    <div style="margin-top:1rem;">
      <button class="coupon-btn" style="background:#aaa;" onclick="closeCouponModal()">Close</button>
    </div>
  </div>
</div>

<script>
let discount = 0;
let couponCode = '';

function openCouponModal() {
  document.getElementById('couponModal').style.display = 'flex';
}
function closeCouponModal() {
  document.getElementById('couponModal').style.display = 'none';
}
function applyCoupon(code, value) {
  couponCode = code;
  discount = value;
  document.getElementById('appliedCoupon').innerText = `${code} applied (${value*100}% off)`;
  closeCouponModal();
}

// Pass data to Step 2
function goToPayment() {
  const imgQty = document.getElementById('imgQty').value;
  const imgType = document.getElementById('imgType').value;
  const fontQty = document.getElementById('fontQty').value;
  const fontSelect = document.getElementById('fontSelect').value;
  const bgQty = document.getElementById('bgQty').value;
  const bgTheme = document.getElementById('bgTheme').value;
  const state = document.getElementById('stateSelect').value;

  const params = new URLSearchParams({
    imgQty,imgService:imgType,
    fontQty,fontSelect,
    bgQty,bgTheme,
    state,
    couponCode,
    discount
  });

  window.location.href = `payment_step2.html?${params.toString()}`;
}
</script>
</body>
</html>
