<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabby's Graphicz – Step 1</title>

    <!-- Babaloo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Babaloo&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #E8CBAF; /* cheetah-inspired neutral */
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            font-family: 'Babaloo', cursive;
            font-size: 52px;
            text-align: center;
            color: #000;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 40px;
            font-size: 28px;
            color: #111;
            font-weight: bold;
        }

        .service-box {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        label {
            font-size: 18px;
        }

        select, input {
            margin-top: 8px;
            padding: 8px;
            font-size: 16px;
            width: 100%;
            border-radius: 6px;
        }

        .sample-wrapper {
            margin-top: 25px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .total-box {
            margin-top: 25px;
            background: #000;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 22px;
            text-align: center;
            font-weight: bold;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #000;
            color: #fff;
            font-size: 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>

    <script>
        function calculateTotal() {
            let imgQty = document.getElementById("imgQty").value;
            let fontQty = document.getElementById("fontQty").value;
            let bgQty = document.getElementById("bgQty").value;

            let total =
                (imgQty * 0.75) +
                (fontQty * 1.50) +
                (bgQty * 1.50);

            document.getElementById("total").innerHTML = "Total: $" + total.toFixed(2);
        }
    </script>
</head>

<body>
<div class="container">

    <h1>Gabby's Graphicz</h1>

    <!-- SERVICES SECTION -->
    <h2>Choose Your Services</h2>

    <div class="service-box">
        <label>Images & Illustrations – $0.75–$1.00 per image</label>
        <input type="number" id="imgQty" min="0" placeholder="How many images?" oninput="calculateTotal()">
    </div>

    <div class="service-box">
        <label>Fonts & Typography Design – $1.50–$3.50 per font</label>
        <input type="number" id="fontQty" min="0" placeholder="How many fonts?" oninput="calculateTotal()">
    </div>

    <div class="service-box">
        <label>Backgrounds & Textures – $1.50–$3.50 per design</label>
        <input type="number" id="bgQty" min="0" placeholder="How many backgrounds?" oninput="calculateTotal()">
    </div>

    <div class="service-box">
        <label>College Student Discount</label>
        <select id="discount" onchange="calculateTotal()">
            <option value="0">None</option>
            <option value="10">10% Off</option>
            <option value="20">20% Off</option>
        </select>
    </div>

    <!-- TOTAL -->
    <div class="total-box" id="total">Total: $0.00</div>

    <!-- SAMPLES SECTION -->
    <h2>Sample Work</h2>

    <div class="sample-wrapper">
        <!-- SAMPLE 1 -->
        <div style="position: relative; width: 100%; height: 0; padding-top: 56.25%;
             overflow: hidden; border-radius: 8px; box-shadow: 0 2px 8px rgba(63,69,81,0.16);">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; border: none;"
                src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed">
            </iframe>
        </div>
    </div>

    <div class="sample-wrapper">
        <!-- SAMPLE 2 -->
        <div style="position: relative; width: 100%; height: 0; padding-top: 141.42%;
             overflow: hidden; border-radius: 8px; box-shadow: 0 2px 8px rgba(63,69,81,0.16);">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; border: none;"
                src="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view?embed">
            </iframe>
        </div>
    </div>

    <div class="sample-wrapper">
        <!-- SAMPLE 3 -->
        <div style="position: relative; width: 100%; height: 0; padding-top: 56.25%;
             overflow: hidden; border-radius: 8px; box-shadow: 0 2px 8px rgba(63,69,81,0.16);">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; border: none;"
                src="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view?embed">
            </iframe>
        </div>
    </div>

    <!-- NEXT BUTTON -->
    <button onclick="window.location.href='payment_step2.html'">Next → Step 2</button>

</div>
</body>
</html>
