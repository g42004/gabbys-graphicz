<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 1: Select Order</title>
<link href="https://fonts.googleapis.com/css2?family=Babaloo&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(135deg, #FF9A8B, #FF6A88, #FF99AC);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    color: #0B0B0B;
  }
  h1 {
    font-family: 'Babaloo', cursive;
    text-align: center;
    font-size: 3rem;
    color: #fff;
    padding: 20px 0;
    margin: 0;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
  }
  .container {
    max-width: 800px;
    margin: 20px auto;
    background: rgba(255,255,255,0.95);
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
  }
  h2 {
    text-align: center;
    color: #5A3E36;
    margin-top: 1rem;
    font-size: 2rem;
  }
  section {
    margin-top: 1.5rem;
    padding: 1rem;
    background: #f7f7f7;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  label {
    display: block;
    margin-top: 0.75rem;
    font-weight: 600;
  }
  input[type="number"], select {
    padding: 0.75rem;
    margin-top: 0.5rem;
    border-radius: 8px;
    width: 100%;
    font-size: 1rem;
    border: 1px solid #5A3E36;
    box-sizing: border-box;
  }
  .total {
    font-size: 1.8rem;
    font-weight: bold;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 2px solid #F4A7B9;
    text-align: right;
    color: #5A3E36;
  }
  button {
    color: #0B0B0B;
    cursor: pointer;
    font-weight: bold;
    border: none;
    transition: background-color 0.2s, transform 0.1s;
    margin-top: 1.5rem;
    padding: 1rem;
    box-shadow: 0 4px #E08FA8;
    background: #F4A7B9;
    width: 100%;
    border-radius: 8px;
    font-size: 1.2rem;
  }
  button:hover {
    background: #E08FA8;
  }
  button:active {
    transform: translateY(2px);
    box-shadow: 0 2px #E08FA8;
  }
  .samples iframe {
    width: 100%;
    border: none;
    border-radius: 8px;
    height: 400px;
    margin-bottom: 1rem;
  }
  .samples a {
    display: block;
    text-align: center;
    margin-bottom: 2rem;
    font-weight: bold;
    color: #5A3E36;
  }
</style>
</head>
<body>
<h1>Gabby's Graphicz</h1>
<div class="container">
  <h2>Step 1: Select Your Order</h2>

  <!-- Service Type -->
  <section>
    <label for="serviceType">Type of Service:</label>
    <select id="serviceType">
      <option value="custom">Custom Design</option>
      <option value="logo">Logo Design</option>
      <option value="poster">Poster Design</option>
      <option value="social">Social Media Graphics</option>
    </select>
  </section>

  <!-- Images & Illustrations -->
  <section>
    <h3>Images & Illustrations – $0.75 - $1.00 per image</h3>
    <label for="imgQty">Quantity:</label>
    <input type="number" id="imgQty" min="0" value="0">
    
    <div class="samples">
      <!-- Embed Sample 1 -->
      <iframe src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed" allowfullscreen></iframe>
      <a href="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view" target="_blank">Sample Design 1</a>

      <!-- Embed Sample 2 -->
      <iframe src="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view?embed" allowfullscreen></iframe>
      <a href="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view" target="_blank">Sample Design 2</a>

      <!-- Embed Sample 3 -->
      <iframe src="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view?embed" allowfullscreen></iframe>
      <a href="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view" target="_blank">Sample Design 3</a>
    </div>
  </section>

  <!-- Fonts & Typography -->
  <section>
    <h3>Fonts & Typography Design – $1.50 - $3.50 per font</h3>
    <label for="fontQty">Quantity:</label>
    <input type="number" id="fontQty" min="0" value="0">
  </section>

  <!-- Backgrounds & Textures -->
  <section>
    <h3>Backgrounds & Textures – $1.50 - $3.50 per design</h3>
    <label for="bgQty">Quantity:</label>
    <input type="number" id="bgQty" min="0" value="0">
  </section>

  <!-- College Discount -->
  <section>
    <label for="discount">College Student Discount (10–20%):</label>
    <input type="number" id="discount" min="10" max="20" value="10"> %
  </section>

  <!-- Total -->
  <div class="total">
    Estimated Total: $<span id="total">0.00</span>
  </div>

  <button id="reviewOrderBtn" onclick="goToPayment()">Proceed to Step 2: Payment</button>
</div>

<script>
  function calculateTotal() {
    let imgQty = parseInt(document.getElementById('imgQty').value)||0;
    let fontQty = parseInt(document.getElementById('fontQty').value)||0;
    let bgQty = parseInt(document.getElementById('bgQty').value)||0;
    let discount = parseInt(document.getElementById('discount').value)||0;

    let imgTotal = 0;
    for (let i=0;i<imgQty;i++){ imgTotal += Math.random()*0.25 + 0.75; }
    let fontTotal = 0;
    for (let i=0;i<fontQty;i++){ fontTotal += Math.random()*2 + 1.5; }
    let bgTotal = 0;
    for (let i=0;i<bgQty;i++){ bgTotal += Math.random()*2 + 1.5; }

    let subtotal = imgTotal + fontTotal + bgTotal;
    let total = subtotal * (1 - discount/100);
    total = Math.max(0.50, total).toFixed(2);
    document.getElementById('total').textContent = total;
    return total;
  }

  ['imgQty','fontQty','bgQty','discount'].forEach(id => {
    document.getElementById(id).addEventListener('input', calculateTotal);
  });

  function goToPayment() {
    const total = calculateTotal();
    const params = new URLSearchParams({
      img: document.getElementById('imgQty').value,
      font: document.getElementById('fontQty').value,
      bg: document.getElementById('bgQty').value,
      discount: document.getElementById('discount').value,
      service: document.getElementById('serviceType').value,
      amount: total
    });
    window.location.href = `payment_step2.html?${params.toString()}`;
  }

  calculateTotal();
</script>
</body>
</html>
