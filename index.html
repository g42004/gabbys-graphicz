<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Step 1 – Gabby’s Graphicz Order Form</title>

<!-- Google Font: Babaloo -->
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: url('https://i.imgur.com/GPtDBg2.jpeg'); /* Pink cheetah print */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #222;
    }

    .container {
        background: rgba(255, 255, 255, 0.92);
        margin: 40px auto;
        padding: 30px;
        border-radius: 16px;
        width: 80%;
        max-width: 900px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    h1 {
        font-family: 'Balsamiq Sans', cursive;
        text-align: center;
        font-size: 48px;
        color: #d1007f;
        margin-bottom: 20px;
    }

    h2 {
        font-size: 28px;
        border-bottom: 2px solid #d1007f;
        padding-bottom: 6px;
        margin-top: 40px;
        color: #c1006f;
    }

    .service-box {
        padding: 15px;
        margin-bottom: 20px;
        background: #ffe3f1;
        border-left: 5px solid #ff4fb3;
        border-radius: 8px;
    }

    label {
        font-size: 18px;
        font-weight: bold;
    }

    input[type="number"] {
        width: 80px;
        padding: 8px;
        margin-left: 10px;
        font-size: 16px;
    }

    #total {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #c1006f;
        margin-top: 30px;
        padding: 15px;
        background: #ffd7ee;
        border-radius: 10px;
    }

    .sample-box {
        margin-top: 20px;
        margin-bottom: 40px;
    }

    iframe {
        border: none;
        width: 100%;
        height: 400px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(63,69,81,0.18);
    }
</style>

<script>
function updateTotal() {
    let imgQty = document.getElementById("imgQty").value;
    let fontQty = document.getElementById("fontQty").value;
    let bgQty = document.getElementById("bgQty").value;

    let imgPrice = 0.75;
    let fontPrice = 1.50;
    let bgPrice = 1.50;

    let total = (imgQty * imgPrice) + (fontQty * fontPrice) + (bgQty * bgPrice);

    document.getElementById("total").innerHTML = "Total: $" + total.toFixed(2);
}
</script>

</head>
<body>

<div class="container">

<h1>Gabby’s Graphicz – Step One</h1>

<p style="text-align:center; font-size:20px;">
    Choose what you need, check the samples, enter your quantities, and your total updates automatically.
</p>

<!-- SERVICES SECTION -->
<h2>Services & Pricing</h2>

<div class="service-box">
    <label>Images & Illustrations – $0.75–$1.00 per image</label><br>
    Quantity: <input type="number" id="imgQty" value="0" min="0" onchange="updateTotal()">
</div>

<div class="service-box">
    <label>Fonts & Typography Design – $1.50–$3.50 per font</label><br>
    Quantity: <input type="number" id="fontQty" value="0" min="0" onchange="updateTotal()">
</div>

<div class="service-box">
    <label>Backgrounds & Textures – $1.50–$3.50 per design</label><br>
    Quantity: <input type="number" id="bgQty" value="0" min="0" onchange="updateTotal()">
</div>

<div class="service-box">
    <label>College Student Discounts – 10–20% off (applied later)</label>
</div>

<div id="total">Total: $0.00</div>

<!-- SAMPLES SECTION -->
<h2>Sample Designs</h2>

<div class="sample-box">
    <h3>Sample 1</h3>
    <iframe src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed" allowfullscreen></iframe>
</div>

<div class="sample-box">
    <h3>Sample 2</h3>
    <iframe src="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view?embed" allowfullscreen></iframe>
</div>

<div class="sample-box">
    <h3>Sample 3</h3>
    <iframe src="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view?embed" allowfullscreen></iframe>
</div>

</div>

</body>
</html>
