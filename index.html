<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gabby's Graphicz – Step 1</title>

<!-- Babaloo Font -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial;
        background: #F7D6C5; /* Soft cheetah-toned beige */
    }

    h1 {
        font-family: 'Bebas Neue', cursive;
        text-align: center;
        font-size: 60px;
        margin-top: 20px;
    }

    .container {
        width: 90%;
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .section-title {
        font-size: 28px;
        margin-top: 30px;
        font-weight: bold;
        text-decoration: underline;
    }

    .service-box {
        background: #FFE9E3;
        padding: 15px;
        margin-top: 10px;
        border-radius: 10px;
    }

    label {
        font-weight: bold;
    }

    .total-box {
        margin-top: 30px;
        background: #F9C9B9;
        padding: 20px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        border-radius: 10px;
    }

    button {
        margin-top: 25px;
        width: 100%;
        padding: 15px;
        background: #D86F52;
        color: white;
        border: none;
        font-size: 22px;
        border-radius: 10px;
        cursor: pointer;
    }

    button:hover {
        background: #b85a42;
    }

    iframe {
        border-radius: 8px;
        border: none;
    }
</style>

<script>
function updateTotal() {
    let imagesQty = document.getElementById("imgQty").value;
    let fontsQty = document.getElementById("fontQty").value;
    let bgQty = document.getElementById("bgQty").value;

    // Prices
    let imgPrice = 0.75;
    let fontPrice = 1.50;
    let bgPrice = 1.50;

    let total = (imagesQty * imgPrice) + (fontsQty * fontPrice) + (bgQty * bgPrice);
    document.getElementById("total").innerText = "$" + total.toFixed(2);
}
</script>

</head>

<body>

<h1>Gabby's Graphicz – Order Step 1</h1>

<div class="container">

    <!-- Choose Service -->
    <h2 class="section-title">Choose Your Service</h2>
    <select id="serviceType" style="width:100%; padding:10px; font-size:18px;">
        <option value="Images">Images & Illustrations</option>
        <option value="Fonts">Fonts & Typography</option>
        <option value="Background">Backgrounds & Textures</option>
        <option value="Discount">College Student Discount</option>
    </select>

    <!-- Images & Illustrations Section -->
    <div class="service-box">
        <label>Images & Illustrations – $0.75–$1.00 per image</label><br>
        Quantity:
        <input type="number" id="imgQty" min="0" value="0" onchange="updateTotal()">
    </div>

    <!-- Fonts Section -->
    <div class="service-box">
        <label>Fonts & Typography Design – $1.50–$3.50 per font</label><br>
        Quantity:
        <input type="number" id="fontQty" min="0" value="0" onchange="updateTotal()">
    </div>

    <!-- Background Section -->
    <div class="service-box">
        <label>Backgrounds & Textures – $1.50–$3.50 per design</label><br>
        Quantity:
        <input type="number" id="bgQty" min="0" value="0" onchange="updateTotal()">
    </div>

    <!-- Total -->
    <div class="total-box">
        Total: <span id="total">$0.00</span>
    </div>

    <!-- Samples -->
    <h2 class="section-title">Sample Images & Illustrations</h2>

    <!-- SAMPLE 1 -->
    <div style="margin-top:20px;">
        <iframe loading="lazy" width="100%" height="350"
            src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed" allowfullscreen>
        </iframe>
    </div>

    <!-- SAMPLE 2 -->
    <div style="margin-top:20px;">
        <iframe loading="lazy" width="100%" height="350"
            src="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view?embed" allowfullscreen>
        </iframe>
    </div>

    <!-- SAMPLE 3 -->
    <div style="margin-top:20px;">
        <iframe loading="lazy" width="100%" height="350"
            src="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view?embed" allowfullscreen>
        </iframe>
    </div>

    <!-- Step 2 -->
    <a href="STEP2_URL_HERE">
        <button>Continue to Step 2</button>
    </a>

</div>

</body>
</html>
