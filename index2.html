<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment – Gabby's Graphicz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffc5e3; 
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 25px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background-color: hotpink;
            color: white;
            text-decoration: none;
            font-size: 17px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .payment-section {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #aaa;
        }

        label {
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">

        <h2>Choose Your Payment Method</h2>

        <!-- PAYPAL BUTTON -->
        <div class="payment-section">
            <h3>PayPal</h3>
            <p>Pay quickly and securely using PayPal.</p>
            <a class="button" href="https://www.paypal.me/YOURUSERNAME" target="_blank">
                Pay with PayPal
            </a>
        </div>

        <!-- CREDIT / DEBIT CARDS -->
        <div class="payment-section">
            <h3>Credit or Debit Card</h3>
            <label>Name on Card</label>
            <input type="text" placeholder="Full Name">

            <label>Card Number</label>
            <input type="number" placeholder="0000 0000 0000 0000">

            <label>Expiration Date</label>
            <input type="text" placeholder="MM/YY">

            <label>CVV</label>
            <input type="number" placeholder="123">

            <a class="button" href="confirmation_step3.html">Submit Card Payment</a>
        </div>

        <!-- DIGITAL WALLETS -->
        <div class="payment-section">
            <h3>Digital Wallets</h3>
            <label>Select Wallet</label>
            <select style="width:100%; padding:12px; margin-top:8px; border-radius:6px;">
                <option>Apple Pay</option>
                <option>Google Pay</option>
                <option>Cash App Pay</option>
                <option>Venmo</option>
            </select>

            <a class="button" href="confirmation_step3.html">Use Digital Wallet</a>
        </div>

    </div>
</body>
</html>
