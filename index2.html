<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabby's Graphicz - Step 2: Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffd6ec; /* soft pink */
    }
    .payment-card-label input[type="radio"]:checked + .card-content {
      border-color: #ec4899; /* pink border highlight */
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body class="min-h-screen flex items-start justify-center p-4 sm:p-8">

  <div id="payment-container" class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-6 sm:p-8 space-y-6">
    
    <h1 class="text-3xl font-extrabold text-pink-600 border-b pb-4 mb-4">
      Step 2: Payment
    </h1>

    <p class="text-gray-500 mb-6" id="order-summary">Loading your order details...</p>

    <!-- Payment Method Section -->
    <div id="payment-methods" class="space-y-4">

      <!-- Credit/Debit Card -->
      <label class="payment-card-label block cursor-pointer">
        <input type="radio" name="paymentMethod" value="card" checked class="hidden" onchange="toggleCardForm('card')">
        <div class="card-content p-4 border-2 border-gray-200 rounded-xl transition hover:border-pink-400">
          <span class="text-lg font-semibold text-gray-800">Credit / Debit Card</span>
          <div class="flex space-x-2 mt-2">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png" class="h-6">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b7/MasterCard_Logo.svg" class="h-6">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/American_Express_logo.svg" class="h-6">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Discover_Card_logo.svg" class="h-6">
          </div>
        </div>
      </label>

      <!-- PayPal -->
      <label class="payment-card-label block cursor-pointer">
        <input type="radio" name="paymentMethod" value="paypal" class="hidden" onchange="toggleCardForm('paypal')">
        <div class="card-content p-4 border-2 border-gray-200 rounded-xl transition hover:border-pink-400">
          <span class="text-lg font-semibold text-gray-800">PayPal</span>
        </div>
      </label>

      <!-- Apple Pay -->
      <label class="payment-card-label block cursor-pointer">
        <input type="radio" name="paymentMethod" value="applepay" class="hidden" onchange="toggleCardForm('wallet')">
        <div class="card-content p-4 border-2 border-gray-200 rounded-xl transition hover:border-pink-400">
          <span class="text-lg font-semibold text-gray-800">Apple Pay</span>
        </div>
      </label>

      <!-- Google Pay -->
      <label class="payment-card-label block cursor-pointer">
        <input type="radio" name="paymentMethod" value="googlepay" class="hidden" onchange="toggleCardForm('wallet')">
        <div class="card-content p-4 border-2 border-gray-200 rounded-xl transition hover:border-pink-400">
          <span class="text-lg font-semibold text-gray-800">Google Pay</span>
        </div>
      </label>

      <!-- Cash App Pay -->
      <label class="payment-card-label block cursor-pointer">
        <input type="radio" name="paymentMethod" value="cashapp" class="hidden" onchange="toggleCardForm('wallet')">
        <div class="card-content p-4 border-2 border-gray-200 rounded-xl transition hover:border-pink-400">
          <span class="text-lg font-semibold text-gray-800">Cash App Pay</span>
        </div>
      </label>

      <!-- Venmo -->
      <label class="payment-card-label block cursor-pointer">
        <input type="radio" name="paymentMethod" value="venmo" class="hidden" onchange="toggleCardForm('wallet')">
        <div class="card-content p-4 border-2 border-gray-200 rounded-xl transition hover:border-pink-400">
          <span class="text-lg font-semibold text-gray-800">Venmo</span>
        </div>
      </label>

      <!-- Zelle -->
      <label class="payment-card-label block cursor-pointer">
        <input type="radio" name="paymentMethod" value="zelle" class="hidden" onchange="toggleCardForm('wallet')">
        <div class="card-content p-4 border-2 border-gray-200 rounded-xl transition hover:border-pink-400">
          <span class="text-lg font-semibold text-gray-800">Zelle</span>
        </div>
      </label>

    </div>


    <!-- Card Form -->
    <div id="card-details-form" class="space-y-4 pt-4 border-t mt-6">
      <h2 class="text-xl font-bold text-gray-700">Card Details</h2>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm">
      </div>

      <div class="flex space-x-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Expiry</label>
          <input type="text" id="expiryDate" placeholder="MM/YY"
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm">
        </div>
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
          <input type="text" id="cvv" placeholder="123"
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Cardholder Name</label>
        <input type="text" id="cardholderName" placeholder="Your Name"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm">
      </div>
    </div>


    <!-- Confirm Button -->
    <button onclick="processPayment()"
      class="w-full py-3 px-4 rounded-lg shadow-md text-lg font-medium text-white bg-pink-600 hover:bg-pink-700">
      Confirm Payment
    </button>

  </div>

  <script>
    // Read data from Step 1
    const params = new URLSearchParams(window.location.search);
    const amount = params.get('amount');
    const img = params.get('img');
    const font = params.get('font');
    const bg = params.get('bg');
    const coupon = params.get('coupon');
    const discount = params.get('discount');
    const couponCode = params.get('couponCode');

    // Display summary
    const summary = `
      You selected ${img} images, ${font} fonts, and ${bg} backgrounds.<br>
      ${coupon === 'true' ? `Coupon ${couponCode} applied (${(discount * 100).toFixed(0)}% off).<br>` : ''}
      <strong>Total: $${amount}</strong>
    `;
    document.getElementById('order-summary').innerHTML = summary;

    // Show/hide card form
    function toggleCardForm(method) {
      document.getElementById('card-details-form').style.display =
        method === 'card' ? 'block' : 'none';
    }

    // Send to Step 3
    function processPayment() {
      const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      params.set('method', selectedMethod);

      window.location.href = `confirmation_step3.html?${params.toString()}`;
    }
  </script>

</body>
</html>
