<!-- ORDER SUBMITTED POPUP -->
<div id="submittedPopup"
class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50">

  <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-4 border-pink-300">

    <h2 class="text-4xl font-bold text-pink-500 mb-4">
      🎉 Order Submitted!
    </h2>

    <p class="text-lg text-gray-700 mb-4">
      Thank you for choosing
      <strong>Gabby's Graphicz</strong> 💖
    </p>

    <p class="text-gray-600 mb-6">
      Your order was successfully submitted and sent for processing.
      You will receive updates through email or SMS notifications.
    </p>

    <div class="bg-pink-100 rounded-2xl p-4 mb-6">

      <p class="font-bold text-pink-600 text-xl">
        Reward Points Earned:
      </p>

      <p id="popupPoints"
      class="text-3xl font-extrabold text-pink-500 mt-2">
        0 Points
      </p>

    </div>

    <button
    onclick="continueToStep4()"
    class="w-full bg-pink-500 hover:bg-pink-600 transition text-white font-bold py-3 rounded-2xl text-lg">

      Continue

    </button>

  </div>

</div>

<script>

// SHOW ORDER SUBMITTED POPUP
function showOrderSubmitted(){

  // GET TOTAL
  const totalText =
  document.getElementById('grandTotal').innerText
  .replace('$','');

  const total =
  parseFloat(totalText) || 0;

  // POINT SYSTEM
  const rewardPoints =
  Math.floor(total * 10);

  // UPDATE POPUP
  document.getElementById('popupPoints').innerText =
  rewardPoints + " Points";

  // SHOW POPUP
  document.getElementById('submittedPopup')
  .classList.remove('hidden');

  document.getElementById('submittedPopup')
  .classList.add('flex');

}

// CONTINUE TO STEP 4
function continueToStep4(){

  const params = new URLSearchParams();

  // QUANTITIES
  params.set(
    'imgQty',
    document.getElementById('imgQty').value
  );

  params.set(
    'fontQty',
    document.getElementById('fontQty').value
  );

  params.set(
    'bgQty',
    document.getElementById('bgQty').value
  );

  // SERVICES
  params.set(
    'imgService',
    document.getElementById('imgType').value
  );

  params.set(
    'fontSelect',
    document.getElementById('fontSelect').value
  );

  params.set(
    'bgTheme',
    document.getElementById('bgTheme').value
  );

  // STATE
  params.set(
    'state',
    document.getElementById('stateSelect').value
  );

  // TOTAL
  params.set(
    'total',
    document.getElementById('grandTotal')
    .innerText.replace('$','')
  );

  // REDIRECT
  window.location.href =
  `step4.html?${params.toString()}`;

}

</script>

<!-- SUBMIT ORDER BUTTON -->
<button
onclick="showOrderSubmitted()"
class="w-full mt-8 bg-pink-500 hover:bg-pink-600 transition text-white font-bold py-4 rounded-2xl text-xl shadow-lg">

✨ Submit Order

</button>
