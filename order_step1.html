<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabby's Graphicz – Step 1</title>

    <!-- Babaloo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Babaloo&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://i.imgur.com/l09CznV.jpeg'); /* cheetah pattern */
            background-size: cover;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            color: black;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.8);
            padding: 25px;
            margin: 40px auto;
            border-radius: 12px;
        }

        h1 {
            font-family: "Babaloo", cursive;
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
            color: #d91e63;
            font-weight: bold;
        }

        h2 {
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 10px;
            color: #222;
            text-align: center;
        }

        .service-box {
            margin: 15px 0;
        }

        label {
            font-size: 20px;
        }

        .button-box {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background: #d91e63;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #b21852;
        }

        .sample-frame {
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Gabby's Graphicz</h1>

    <h2>Choose Your Service</h2>

    <form action="payment_step2.html" method="GET">

        <div class="service-box">
            <input type="checkbox" name="service" value="Logo Design">
            <label>Logo Design – $15</label>
        </div>

        <div class="service-box">
            <input type="checkbox" name="service" value="Flyer Design">
            <label>Flyer Design – $18</label>
        </div>

        <div class="service-box">
            <input type="checkbox" name="service" value="Business Card">
            <label>Business Card – $10</label>
        </div>

        <div class="service-box">
            <input type="checkbox" name="service" value="Invitations">
            <label>Invitations – $12</label>
        </div>

        <div class="service-box">
            <input type="checkbox" name="service" value="Social Media Graphics">
            <label>Social Media Graphics – $20</label>
        </div>

        <div class="service-box">
            <input type="checkbox" name="service" value="Custom Illustration">
            <label>Custom Illustration – $25</label>
        </div>

        <div class="button-box">
            <button type="submit">Next Step</button>
        </div>
    </form>




    <h2>Samples (Images & Illustrations)</h2>

                src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed"
