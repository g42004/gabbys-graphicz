<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabby’s Graphicz – Step 1</title>

    <style>
        body {
            font-family: "Poppins", Arial, sans-serif;
            background: #ffd6eb;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            text-align: center;
            padding: 25px 10px;
            background: white;
            border-bottom: 4px solid hotpink;
        }

        header h1 {
            font-size: 40px;
            margin: 0;
            font-weight: 700;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .section-title {
            font-size: 30px;
            margin-top: 40px;
            margin-bottom: 20px;
            border-left: 5px solid hotpink;
            padding-left: 10px;
            font-weight: 600;
        }

        .product-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid hotpink;
            font-size: 16px;
        }

        .next-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: hotpink;
            color: white;
            text-align: center;
            border-radius: 10px;
            font-size: 20px;
            margin-top: 30px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Sample embeds */
        .sample-box {
            margin-bottom: 50px;
        }

        iframe {
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(63,69,81,0.16);
        }
    </style>
</head>

<body>

<header>
    <h1>Gabby’s Graphicz – Order Step 1</h1>
    <p>Select Your Product</p>
</header>

<div class="container">

    <div class="product-box">
        <h2 class="section-title">Choose a Service</h2>

        <label for="product">Select what you want designed:</label>
        <select id="product" onchange="saveChoice()">
            <option value="">Select an option…</option>
            <option value="Logo – $10">Logo – $10</option>
            <option value="Flyer – $7">Flyer – $7</option>
            <option value="Business Card – $5">Business Card – $5</option>
            <option value="Thumbnail – $5">Thumbnail – $5</option>
            <option value="Banner – $10">Banner – $10</option>
            <option value="Intro/Outro – $15">Intro/Outro – $15</option>
            <option value="Digital Invitation – $6">Digital Invitation – $6</option>
            <option value="Album Cover – $10">Album Cover – $10</option>
            <option value="Custom Illustration – $12">Custom Illustration – $12</option>
        </select>
    </div>


    <!-- ========================= -->
    <!--       SAMPLES SECTION     -->
    <!-- ========================= -->

    <h2 class="section-title">Images & Illustrations (Samples)</h2>

    <!-- SAMPLE 1 -->
    <div class="sample-box">
        <div style="position: relative; width: 100%; height: 0; padding-top: 56.25%; overflow: hidden;">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; border: none;"
                src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed"
                allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
        <p style="text-align:center; margin-top:10px;">
            Sample 1 — by Gabrielle Monroe
        </p>
    </div>

    <!-- SAMPLE 2 -->
    <div class="sample-box">
        <div style="position: relative; width: 100%; height: 0; padding-top: 141.42%; overflow: hidden;">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; border: none;"
                src="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view?embed"
                allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
        <p style="text-align:center; margin-top:10px;">
            Sample 2 — Black & White Minimal Poster
        </p>
    </div>

    <!-- SAMPLE 3 -->
    <div class="sample-box">
        <div style="position: relative; width: 100%; height: 0; padding-top: 56.25%; overflow: hidden;">
            <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; border: none;"
                src="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view?embed"
                allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
        <p style="text-align:center; margin-top:10px;">
            Sample 3 — by Gabrielle Monroe
        </p>
    </div>


    <!-- NEXT BUTTON -->
    <a class="next-btn" href="payment_step2.html">Continue to Payment</a>

</div>


<script>
    function saveChoice() {
        const value = document.getElementById("product").value;
        localStorage.setItem("selectedProduct", value);
    }
</script>

</body>
</html>
