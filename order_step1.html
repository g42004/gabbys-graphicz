<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 1: Select Order</title>
<style>
  body {
    font-family: 'Inter', Arial, sans-serif;
    background-color: #ffc0cb; /* pink background */
    color: #0B0B0B;
    padding: 2rem;
    background-image: radial-gradient(#F4A7B9 5%, transparent 5%);
    background-size: 40px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  h1 { text-align: center; color: #F4A7B9; }
  .container { 
    width: 100%;
    max-width: 650px; 
    margin: auto; 
    background: rgba(255,255,255,0.95); 
    padding: 2rem; 
    border-radius: 12px; 
    box-shadow: 0 8px 16px rgba(0,0,0,0.3); 
  }
  input[type="number"], input[type="text"] { 
    padding: 0.75rem; margin: 0.5rem 0; border-radius: 8px; width: 100%; font-size: 1rem; border: 1px solid #5A3E36; 
  }
  button {
    color: white;
    font-weight: bold;
    border: none;
    padding: 1rem;
    width: 100%;
    border-radius: 8px;
    background-color: #F4A7B9;
    margin-top: 1.5rem;
    cursor: pointer;
  }
  button:hover { background-color: #E08FA8; }
  .total { font-size: 1.8rem; font-weight: bold; margin-top: 2rem; text-align: right; color: #5A3E36; }
</style>
</head>
<body>
<div class="container">
    <h1>Gabby's Graphicz - Custom Order</h1>
    <form id="orderForm">
        <h2>1. Select Your Items</h2>
        <label>Images ($0.75 - $1.00 per image)</label>
        <input type="number" id="imgQty" min="0" value="0">

        <label>Fonts ($1.50 - $3.50 per font)</label>
        <input type="number" id="fontQty" min="0" value="0">

        <label>Backgrounds ($1.50 - $3.50 per design)</label>
        <input type="number" id="bgQty" min="0" value="0">

        <div class="total">Total: $<span id="total">0.00</span></div>

        <button type="submit">Proceed to Payment</button>
    </form>
</div>

<script>
(function(){
    const totalDisplay = document.getElementById('total');
    const form = document.getElementById('orderForm');

    function calculateTotal() {
        const imgQty = parseInt(document.getElementById('imgQty').value)||0;
        const fontQty = parseInt(document.getElementById('fontQty').value)||0;
        const bgQty = parseInt(document.getElementById('bgQty').value)||0;

        let total = 0;
        for(let i=0;i<imgQty;i++) total += Math.random()*0.25+0.75;
        for(let i=0;i<fontQty;i++) total += Math.random()*2+1.5;
        for(let i=0;i<bgQty;i++) total += Math.random()*2+1.5;

        total = total.toFixed(2);
        totalDisplay.textContent = total;
        return total;
    }

    ['imgQty','fontQty','bgQty'].forEach(id => {
        document.getElementById(id).addEventListener('input', calculateTotal);
    });

    form.addEventListener('submit', function(e){
        e.preventDefault();
        const amount = calculateTotal();
        const img = document.getElementById('imgQty').value;
        const font = document.getElementById('fontQty').value;
        const bg = document.getElementById('bgQty').value;

        const params = new URLSearchParams({img, font, bg, amount});
        window.location.href = `payment_step2.html?${params.toString()}`;
    });

    calculateTotal();
})();
</script>
</body>
</html>
