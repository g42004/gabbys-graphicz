<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 1: Select Services</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Babaloo&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #ffe4e1; /* soft pink background */
        padding: 2rem;
    }
    h1 { font-family: 'Babaloo', cursive; color: #F472B6; font-size: 2.5rem; text-align:center; margin-bottom:1rem; }
    .container { max-width:800px; margin:0 auto; background:white; padding:2rem; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.2); }
    section { margin-bottom:1.5rem; }
    label { display:block; margin-bottom:0.5rem; font-weight:bold; }
    input[type=number] { width:80px; padding:0.3rem; border:1px solid #ccc; border-radius:5px; }
    select { padding:0.3rem; border:1px solid #ccc; border-radius:5px; }
    .total { font-size:1.2rem; font-weight:bold; margin-top:1rem; text-align:right; }
    .button { margin-top:2rem; display:block; width:100%; padding:1rem; background:#F472B6; color:white; font-weight:bold; border:none; border-radius:8px; cursor:pointer; font-size:1.1rem; }
    .samples { display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; margin-top:1rem; }
    .samples iframe { width:250px; height:140px; border-radius:8px; border:none; }
    footer { margin-top:2rem; text-align:center; font-size:0.85rem; color:#555; }
</style>
</head>
<body>
<div class="container">
    <h1>Gabby's Graphicz - Select Your Services</h1>

    <section>
        <label for="state">Select Your State:</label>
        <select id="state" onchange="calculateTotal()">
            <option value="NC">North Carolina</option>
            <option value="Other">Other State</option>
        </select>
    </section>

    <section>
        <label>Images & Illustrations ($0.75 - $1.00 each):</label>
        <input type="number" id="imgQty" value="0" min="0" onchange="calculateTotal()"> quantity
        <select id="imgType">
            <option value="Posters">Posters</option>
            <option value="Flyers">Flyers</option>
            <option value="Logos">Logos</option>
            <option value="Birthday">Birthday</option>
        </select>

        <div class="samples">
            <iframe src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed"></iframe>
            <iframe src="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view?embed"></iframe>
            <iframe src="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view?embed"></iframe>
        </div>
    </section>

    <section>
        <label>Fonts & Typography Design ($1.50 - $3.50 per font):</label>
        <input type="number" id="fontQty" value="0" min="0" onchange="calculateTotal()">
        <select id="fontSelect">
            <option value="Babaloo">Babaloo</option>
            <option value="Caveat">Caveat</option>
            <option value="Roboto">Roboto</option>
            <option value="Montserrat">Montserrat</option>
        </select>
    </section>

    <section>
        <label>Backgrounds & Textures ($1.50 - $3.50 per design):</label>
        <input type="number" id="bgQty" value="0" min="0" onchange="calculateTotal()">
        <select id="bgColor">
            <option value="Cheetah">Cheetah</option>
            <option value="Gradient">Gradient</option>
            <option value="Solid">Solid Color</option>
        </select>
    </section>

    <section>
        <label>College Student Discount:</label>
        <select id="isStudent" onchange="calculateTotal()">
            <option value="no">No Discount</option>
            <option value="yes">10–20% Off</option>
        </select>
    </section>

    <section>
        <label>Coupon Code:</label>
        <select id="couponCode" onchange="calculateTotal()">
            <option value="None">None</option>
            <option value="BLACKFRIDAY">BLACKFRIDAY</option>
            <option value="THANKSGIVING">THANKSGIVING</option>
            <option value="CHRISTMAS">CHRISTMAS</option>
        </select>
    </section>

    <div class="total">Total: $<span id="totalAmount">0.00</span></div>

    <button class="button" onclick="goToStep2()">Next: Payment</button>
</div>

<footer>
    &copy; Gabrielle Monroe 2025
</footer>

<script>
function calculateTotal() {
    const imgQty = parseFloat(document.getElementById('imgQty').value) || 0;
    const fontQty = parseFloat(document.getElementById('fontQty').value) || 0;
    const bgQty = parseFloat(document.getElementById('bgQty').value) || 0;
    const isStudent = document.getElementById('isStudent').value;
    const coupon = document.getElementById('couponCode').value;
    const state = document.getElementById('state').value;

    // Price ranges (take midpoint for simplicity)
    const imgPrice = 0.875; // midpoint of 0.75-1.00
    const fontPrice = 2.50; // midpoint of 1.50-3.50
    const bgPrice = 2.50; // midpoint of 1.50-3.50

    let subtotal = (imgQty * imgPrice) + (fontQty * fontPrice) + (bgQty * bgPrice);

    // College student discount
    if (isStudent === 'yes') subtotal *= 0.85; // 15% off

    // Coupon discounts
    if (coupon === 'BLACKFRIDAY') subtotal *= 0.7; // 30% off
    if (coupon === 'THANKSGIVING') subtotal *= 0.8; // 20% off
    if (coupon === 'CHRISTMAS') subtotal *= 0.75; // 25% off

    // Tax
    let taxRate = 0;
    if (state === 'NC') taxRate = 0.0675; // NC sales tax
    else taxRate = 0.05; // default for other states
    const tax = subtotal * taxRate;

    const total = subtotal + tax;
    document.getElementById('totalAmount').textContent = total.toFixed(2);
}

function goToStep2() {
    const params = new URLSearchParams();
    params.set('imgQty', document.getElementById('imgQty').value);
    params.set('imgService', document.getElementById('imgType').value);
    params.set('fontQty', document.getElementById('fontQty').value);
    params.set('fontSelect', document.getElementById('fontSelect').value);
    params.set('bgQty', document.getElementById('bgQty').value);
    params.set('bg', document.getElementById('bgColor').value);
    params.set('isStudent', document.getElementById('isStudent').value);
    params.set('couponCode', document.getElementById('couponCode').value);
    params.set('state', document.getElementById('state').value);
    params.set('amount', document.getElementById('totalAmount').textContent);

    window.location.href = `payment_step2.html?${params.toString()}`;
}

// Initialize total
calculateTotal();
</script>
</body>
</html>
