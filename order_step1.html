<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Step 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Babaloo&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
    padding: 2rem;
  }
  h1 { font-family: 'Babaloo', cursive; font-size: 2.5rem; color: white; text-align: center; margin-bottom: 1rem; text-shadow: 1px 1px 4px #000; }
  .container { max-width: 900px; margin:auto; background:#fff; padding:2rem; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2);}
  .service-section { margin-bottom:1.5rem; }
  label { font-weight:bold; display:block; margin-bottom:0.5rem; }
  input[type="number"], select, input[type="text"] { width:100%; padding:0.5rem; border-radius:8px; border:1px solid #ccc; margin-bottom:0.5rem; }
  button { background:#F472B6; color:white; font-weight:bold; padding:0.8rem 1.2rem; border:none; border-radius:8px; cursor:pointer; }
  button:hover { background:#EC4899; }
  iframe { border-radius:8px; margin-bottom:1rem; width:100%; height:300px; }
  .popup { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; }
  .popup-content { background:white; padding:2rem; border-radius:12px; text-align:center; }
  .close-btn { margin-top:1rem; padding:0.5rem 1rem; background:#F472B6; color:white; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>

<h1>Gabby's Graphicz - Design Services</h1>

<div class="container">

  <!-- Sample Images & Illustrations -->
  <div class="service-section">
    <label>Sample Images & Illustrations</label>
    <iframe src="https://www.canva.com/design/DAG0FHls9Bg/MYjkPdUSSISEQDmDkIzp0A/view?embed"></iframe>
    <iframe src="https://www.canva.com/design/DAGdnrj0aCc/h6FpB30amYqiJy73BWOk_A/view?embed"></iframe>
    <iframe src="https://www.canva.com/design/DAFdwrre3oU/r19HnMhEn9r0LaqH4LJmVQ/view?embed"></iframe>
    <input type="number" id="imgQty" min="0" value="0" placeholder="Quantity ($0.75 - $1.00 each)">
    <input type="text" id="imgType" placeholder="What type (poster, flyer, logo, birthday, etc.)">
  </div>

  <!-- Fonts & Typography -->
  <div class="service-section">
    <label>Fonts & Typography</label>
    <select id="fontSelect">
      <option value="Babaloo">Babaloo</option>
      <option value="Montserrat">Montserrat</option>
      <option value="Lobster">Lobster</option>
      <option value="Poppins">Poppins</option>
      <option value="Pacifico">Pacifico</option>
    </select>
    <input type="number" id="fontQty" min="0" value="0" placeholder="Quantity ($1.50 - $3.50 each)">
  </div>

  <!-- Backgrounds & Textures -->
  <div class="service-section">
    <label>Backgrounds & Textures</label>
    <select id="bgSelect">
      <option value="Cheetah">Cheetah</option>
      <option value="Rainbow">Rainbow</option>
      <option value="Minimal">Minimal</option>
      <option value="Retro">Retro</option>
    </select>
    <input type="number" id="bgQty" min="0" value="0" placeholder="Quantity ($1.50 - $3.50 each)">
  </div>

  <!-- State selection -->
  <div class="service-section">
    <label>Select Your State</label>
    <select id="stateSelect">
      <option value="NC">North Carolina</option>
      <option value="AL">Alabama</option>
      <option value="AK">Alaska</option>
      <option value="AZ">Arizona</option>
      <option value="AR">Arkansas</option>
      <option value="CA">California</option>
      <option value="CO">Colorado</option>
      <option value="CT">Connecticut</option>
      <option value="DE">Delaware</option>
      <option value="FL">Florida</option>
      <option value="GA">Georgia</option>
      <option value="HI">Hawaii</option>
      <option value="ID">Idaho</option>
      <option value="IL">Illinois</option>
      <option value="IN">Indiana</option>
      <option value="IA">Iowa</option>
      <option value="KS">Kansas</option>
      <option value="KY">Kentucky</option>
      <option value="LA">Louisiana</option>
      <option value="ME">Maine</option>
      <option value="MD">Maryland</option>
      <option value="MA">Massachusetts</option>
      <option value="MI">Michigan</option>
      <option value="MN">Minnesota</option>
      <option value="MS">Mississippi</option>
      <option value="MO">Missouri</option>
      <option value="MT">Montana</option>
      <option value="NE">Nebraska</option>
      <option value="NV">Nevada</option>
      <option value="NH">New Hampshire</option>
      <option value="NJ">New Jersey</option>
      <option value="NM">New Mexico</option>
      <option value="NY">New York</option>
      <option value="ND">North Dakota</option>
      <option value="OH">Ohio</option>
      <option value="OK">Oklahoma</option>
      <option value="OR">Oregon</option>
      <option value="PA">Pennsylvania</option>
      <option value="RI">Rhode Island</option>
      <option value="SC">South Carolina</option>
      <option value="SD">South Dakota</option>
      <option value="TN">Tennessee</option>
      <option value="TX">Texas</option>
      <option value="UT">Utah</option>
      <option value="VT">Vermont</option>
      <option value="VA">Virginia</option>
      <option value="WA">Washington</option>
      <option value="WV">West Virginia</option>
      <option value="WI">Wisconsin</option>
      <option value="WY">Wyoming</option>
    </select>
  </div>

  <!-- Coupon popup button -->
  <button onclick="showCouponPopup()">Apply Coupon</button>

  <!-- SMS signup -->
  <div class="service-section">
    <label>Sign up for SMS notifications:</label>
    <input type="text" id="phoneNumber" placeholder="Enter your phone number">
  </div>

  <!-- Checkout button -->
  <button onclick="goToStep2()">Proceed to Payment</button>
</div>

<!-- Coupon Popup -->
<div class="popup" id="couponPopup">
  <div class="popup-content">
    <h2>Available Coupons</h2>
    <p>Black Friday: BF2025 (15% off)</p>
    <p>Thanksgiving: TG2025 (10% off)</p>
    <p>Christmas: XMAS2025 (20% off)</p>
    <input type="text" id="couponInput" placeholder="Enter coupon code">
    <button class="close-btn" onclick="applyCoupon()">Apply</button>
    <button class="close-btn" onclick="closeCoupon()">Close</button>
  </div>
</div>

<script>
function showCouponPopup(){
  document.getElementById('couponPopup').style.display = 'flex';
}
function closeCoupon(){
  document.getElementById('couponPopup').style.display = 'none';
}
function applyCoupon(){
  const code = document.getElementById('couponInput').value.toUpperCase();
  if(code === 'BF2025') { alert('Black Friday 15% discount applied!'); } 
  else if(code === 'TG2025') { alert('Thanksgiving 10% discount applied!'); } 
  else if(code === 'XMAS2025') { alert('Christmas 20% discount applied!'); } 
  else { alert('Invalid coupon code'); return; }
  closeCoupon();
}

function goToStep2(){
  const imgQty = document.getElementById('imgQty').value;
  const imgType = document.getElementById('imgType').value;
  const fontQty = document.getElementById('fontQty').value;
  const fontSelect = document.getElementById('fontSelect').value;
  const bgQty = document.getElementById('bgQty').value;
  const bgSelect = document.getElementById('bgSelect').value;
  const state = document.getElementById('stateSelect').value;
  const couponCode = document.getElementById('couponInput').value.toUpperCase();
  const phoneNumber = document.getElementById('phoneNumber').value;

  const urlParams = new URLSearchParams({
    imgQty, imgService: imgType, fontQty, fontSelect, bgQty, bgTheme: bgSelect, state, couponCode, phoneNumber
  });
  window.location.href = `payment_step2.html?${urlParams.toString()}`;
}
</script>

</body>
</html>
