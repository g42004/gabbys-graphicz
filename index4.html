<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabby's Graphicz - Shopping Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Babaloo&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: 'Roboto', sans-serif;
    background: url('https://images.unsplash.com/photo-1612831455545-8d2e10d1a5f3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxMjA3fDB8MHxzZWFyY2h8Mnx8YmFja2dyb3VuZHxlbnwwfHwwfHw%3D&ixlib=rb-4.0.3&q=80&w=1080') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    padding: 2rem;
  }
  .container { background: rgba(255,255,255,0.95); max-width: 900px; margin: auto; padding: 2rem; border-radius: 12px; box-shadow:0 10px 25px rgba(0,0,0,0.2);}
  h1 { font-family: 'Babaloo', cursive; font-size: 2.8rem; color: #F472B6; text-align: center; margin-bottom:1rem;}
  table { width:100%; border-collapse: collapse; }
  th, td { padding: 0.75rem; border-bottom: 1px solid #ddd; text-align:left; }
  th { background-color: #F472B6; color:white; }
  .remove-btn { color: #EF4444; cursor:pointer; font-weight:bold; }
  footer { margin-top:2rem; text-align:center; font-size:0.9rem; color:#555; }
  .total { font-weight:bold; font-size:1.2rem; margin-top:1rem; text-align:right; }
  .button-base { background-color:#F472B6; color:white; padding:0.75rem 1.5rem; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:1rem;}
</style>
</head>
<body>

<div class="container">
  <h1>Shopping Cart</h1>
  <table>
    <thead>
      <tr>
        <th>Service</th>
        <th>Type/Font</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody id="cartBody">
      <!-- Items will appear here -->
    </tbody>
  </table>

  <div class="total" id="totalDisplay"></div>
  <button onclick="goToStep2()" class="button-base">Proceed to Payment (Step 2)</button>
</div>

<footer>© Gabrielle Monroe 2025</footer>

<script>
const taxRates = { 'NC': 0.0725, 'NY':0.08875, 'CA':0.0725, 'TX':0.0625, 'Other':0 };

// Retrieve order from URL
const params = new URLSearchParams(window.location.search);

let cartItems = [];

// Images
if(parseInt(params.get('imgQty'))>0){
  cartItems.push({
    service:'Images & Illustrations',
    type: params.get('imgService'),
    qty: parseInt(params.get('imgQty')),
    price:0.75
  });
}

// Fonts
if(parseInt(params.get('fontQty'))>0){
  cartItems.push({
    service:'Fonts & Typography',
    type: params.get('fontSelect'),
    qty: parseInt(params.get('fontQty')),
    price:2.5
  });
}

// Backgrounds
if(parseInt(params.get('bgQty'))>0){
  cartItems.push({
    service:'Backgrounds & Textures',
    type:'Designs',
    qty: parseInt(params.get('bgQty')),
    price:2.5
  });
}

const state = params.get('state') || 'NC';
const taxRate = taxRates[state] || 0;

function renderCart(){
  const tbody = document.getElementById('cartBody');
  tbody.innerHTML = '';
  let subtotal = 0;
  cartItems.forEach((item,index)=>{
    const priceTotal = item.price*item.qty;
    subtotal += priceTotal;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${item.service}</td>
                    <td>${item.type}</td>
                    <td>${item.qty}</td>
                    <td>$${priceTotal.toFixed(2)}</td>
                    <td><span class="remove-btn" onclick="removeItem(${index})">X</span></td>`;
    tbody.appendChild(tr);
  });
  const tax = subtotal*taxRate;
  const total = subtotal + tax;
  document.getElementById('totalDisplay').innerHTML = `
    Subtotal: $${subtotal.toFixed(2)}<br>
    Tax (${(taxRate*100).toFixed(2)}%): $${tax.toFixed(2)}<br>
    <strong>Total: $${total.toFixed(2)}</strong>
  `;
}

function removeItem(index){
  cartItems.splice(index,1);
  renderCart();
}

function goToStep2(){
  // Build URL with updated cart
  const newParams = new URLSearchParams();
  cartItems.forEach(item=>{
    if(item.service==='Images & Illustrations') newParams.set('imgQty', item.qty);
    if(item.service==='Fonts & Typography') newParams.set('fontQty', item.qty);
    if(item.service==='Backgrounds & Textures') newParams.set('bgQty', item.qty);
    newParams.set('imgService', params.get('imgService'));
    newParams.set('fontSelect', params.get('fontSelect'));
    newParams.set('state', state);
  });
  window.location.href = `payment_step2.html?${newParams.toString()}`;
}

renderCart();
</script>

</body>
</html>
